# Compilation, tests et paquets d'installation : Windows (NSIS) et macOS (DMG,
# puces Apple). Les paquets sont joints à chaque exécution (« Artifacts »).
# Une étiquette « v* » publie aussi une version (voir release.yml).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  # vcpkg figé sur la version utilisée en développement (Tesseract 5.5.3).
  VCPKG_COMMIT: e456309491fd875487bf02b8a0dca76c1b1b00cc
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows-static-md
            bundle: nsis
            artifact: aura-pdf-windows
          - os: macos-14
            triplet: arm64-osx
            bundle: dmg
            artifact: aura-pdf-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tesseract et ses dépendances en bibliothèques statiques (long la première
      # fois : le dossier « installed » est mis en cache).
      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg/installed
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ matrix.triplet }}-tesseract

      - name: Outils de compilation (macOS)
        if: runner.os == 'macOS' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool pkg-config nasm

      - name: vcpkg et Tesseract
        shell: bash
        run: |
          VCPKG="$RUNNER_TEMP/vcpkg"
          if [ ! -d "$VCPKG/.git" ]; then
            mkdir -p "$VCPKG"
            git -C "$VCPKG" init -q
            git -C "$VCPKG" remote add origin https://github.com/microsoft/vcpkg.git
          fi
          git -C "$VCPKG" fetch -q --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG" checkout -q -f FETCH_HEAD
          if [ "$RUNNER_OS" = "Windows" ]; then "$VCPKG/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG/bootstrap-vcpkg.sh" -disableMetrics; fi
          "$VCPKG/vcpkg" install "tesseract:${{ matrix.triplet }}"
          echo "AURA_VCPKG_ROOT=$VCPKG" >> "$GITHUB_ENV"

      - name: PDFium (macOS)
        if: runner.os == 'macOS'
        run: scripts/fetch-pdfium.sh arm64

      - run: npm ci

      - name: Tests de l'interface
        run: npx tsc --noEmit -p . && npx vitest run

      # Les tests en échec sont aussi signalés en annotations (visibles sans
      # connexion sur la page de l'exécution).
      - name: Tests du cœur
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --lib 2>&1 | tee tests.log; then
            grep -E "^test .* FAILED$" tests.log | sed 's/^/::error title=Test en échec::/' || true
            grep -E -A3 "panicked at" tests.log | head -60 | while IFS= read -r l; do echo "::error title=Détail::$l"; done
            exit 1
          fi

      - name: Paquet d'installation
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
