[package]
name = "aura-pdf"
version = "0.1.0"
description = "Aura PDF — lecteur et éditeur PDF libre"
authors = ["Aura PDF contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "aura_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["thread_safe", "image_025", "pdfium_latest"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }

parking_lot = "0.12"
crossbeam-channel = "0.5"
lopdf = { version = "0.45", default-features = false, features = ["chrono"] }
thiserror = "2"
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }
whoami = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
